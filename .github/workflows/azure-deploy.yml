name: Build and Deploy to Azure VM

on:
  push:
    branches:
      - develop  # adjust if you deploy from a different branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # use your desired Node.js version

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      # Copy the built files and server code to the VM using scp.
      - name: Copy files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}  # Usa el puerto del secreto o 22 si está vacío
          source: "."
          target: "/home/${{ secrets.VM_USERNAME }}/form-app"  # Ajusta el path si es necesario

      # Execute remote commands via SSH to install dependencies and restart the app.
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}  # Asegura que el puerto sea un número válido
          script: |
            cd ~/form-app
            npm install --production
            # Si usas PM2, reinicia la app o iníciala si no está corriendo:
            pm2 restart app || pm2 start server.js --name 5QPRUEBA