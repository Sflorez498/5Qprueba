name: Build and Deploy to Azure VM

on:
  push:
    branches:
      - develop  # Ajusta si despliegas desde otra rama

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.20.0'  # Usa la versión correcta

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      # Copia archivos necesarios al servidor
      - name: Copy files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}  # Usa el puerto desde secretos directamente
          source: |
            package.json
            package-lock.json
            build
            server.js  # Ajusta si tu archivo principal tiene otro nombre
          target: "/home/${{ secrets.VM_USERNAME }}/form-app"

      # Ejecuta comandos en la VM
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            cd ~/form-app
            npm install --production
            pm2 restart app || pm2 start server.js --name app  # Nombre más seguro
            pm2 save
