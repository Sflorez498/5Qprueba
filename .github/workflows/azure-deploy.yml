name: Build and Deploy to Azure VM

on:
  push:
    branches:
      - develop  # Ajusta si despliegas desde otra rama

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.19.1'  # Ajusta la versión si es necesario

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      # Copia los archivos al servidor usando SCP
      - name: Copy files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}  # Usa 22 si VM_PORT está vacío
          source: "./"  # Solo copiará archivos relevantes
          target: "/home/${{ secrets.VM_USERNAME }}/form-app"

      # Ejecuta comandos en la VM después de copiar los archivos
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            cd ~/form-app
            npm install --production
            pm2 restart app || pm2 start server.js --name 5QPRUEBA
